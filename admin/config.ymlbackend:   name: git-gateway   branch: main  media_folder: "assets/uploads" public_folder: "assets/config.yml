backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "assets/uploads"

collections:
  - name: "settings"
    label: "Site Settings"
    files:
      - name: "site"
        label: "All Content"
        file: "site.json"
        format: json
        fields:
          - label: "Hero"
            name: "hero"
            widget: "object"
            fields:
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Subtitle", name: "subtitle", widget: "string"}
              - {label: "Body text", name: "body", widget: "text"}
              - {label: "Tagline", name: "tagline", widget: "string"}
              - {label: "Button Text", name: "ctaText", widget: "string"}
              - {label: "Button Link", name: "ctaHref", widget: "string"}
          - label: "Projects"
            name: "projects"
            widget: "list"
            fields:
              - {label: "Client", name: "client", widget: "string"}
              - {label: "Title", name: "title", widget: "string"}
              - {label: "Primary Role", name: "primaryRole", widget: "string"}
              - {label: "Tags", name: "tags", widget: "list", field: {label: "Tag", name: "tag", widget: "string"}}
              - {label: "Cover Image", name: "cover", widget: "image", required: false}
              - label: "Layout"
                name: "layout"
                widget: "select"
                options:
                  - {label: "Horizontal 16:9", value: "horizontal"}
                  - {label: "Vertical 9:16", value: "vertical"}
                  - {label: "Mixed", value: "mixed"}
              - label: "Videos"
                name: "videos"
                widget: "list"
                fields:
                  - {label: "Video Name", name: "name", widget: "string"}
                  - {label: "Your Role", name: "role", widget: "string"}
                  - label: "Orientation"
                    name: "orientation"
                    widget: "select"
                    options:
                      - {label: "Horizontal 16:9", value: "horizontal"}
                      - {label: "Vertical 9:16", value: "vertical"}
                  - {label: "Vimeo ID", name: "vimeoId", widget: "string", required: false}
                  - {label: "Thumbnail", name: "thumb", widget: "image", required: false}
          - label: "Services"
            name: "services"
            widget: "list"
            fields:
              - {label: "Icon", name: "icon", widget: "string"}
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Description", name: "desc", widget: "text"}
          - label: "Experience"
            name: "experience"
            widget: "list"
            fields:
              - {label: "Role", name: "role", widget: "string"}
              - {label: "Company", name: "company", widget: "string"}
              - {label: "Period", name: "period", widget: "string"}
              - {label: "Logo", name: "logo", widget: "image", required: false}
          - label: "About"
            name: "about"
            widget: "object"
            fields:
              - {label: "Photo", name: "photo", widget: "image", required: false}
              - {label: "Name", name: "name", widget: "string"}
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Bio", name: "bio", widget: "text"}
              - {label: "Skills", name: "skills", widget: "list", field: {label: "Skill", name: "skill", widget: "string"}}
          - label: "Contact"
            name: "contact"
            widget: "object"
            fields:
              - {label: "Heading", name: "heading", widget: "string"}
              - {label: "Sub text", name: "sub", widget: "text"}
              - {label: "Email", name: "email", widget: "string"}
              - {label: "LinkedIn URL", name: "linkedin", widget: "string"}
              - {label: "Vimeo URL", name: "vimeo", widget: "string"}
              - {label: "Behance URL", name: "behance", widget: "string"}
